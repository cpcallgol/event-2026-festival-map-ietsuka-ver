<dialog id="guidePinDialog" class="guide-pin-dialog" aria-labelledby="guidePinTitle">
    <header><div><h2 id="guidePinTitle">看板の案内番号</h2><p>案内したい場所のピンを選んで、番号を看板の空いている場所へドラッグしてください。</p></div><button id="guidePinClose" type="button" aria-label="看板の案内番号を取り消す">×</button></header>
    <label class="guide-pin-enabled"><input id="guidePinEnabled" type="checkbox">画像に案内番号を表示する</label>
    <div class="guide-pin-preview checkerboard"><div id="guidePinPreviewStage" class="guide-pin-preview-stage"><img id="guidePinPreviewImage" alt="案内番号を重ねる画像" draggable="false"></div></div>
    <fieldset id="guidePinControls"><label>案内先のピン<select id="guidePinTarget" required></select></label>
        <div class="guide-pin-position"><label>横位置（%）<input id="guidePinX" type="number" min="0" max="100" step="0.1"></label><label>縦位置（%）<input id="guidePinY" type="number" min="0" max="100" step="0.1"></label><label>番号の大きさ（%）<input id="guidePinSize" type="number" min="4" max="30" step="0.1"></label></div>
        <button id="guidePinReset" type="button">位置と大きさを戻す</button>
    </fieldset>
    <p id="guidePinHelp">番号を振り直すと、看板の番号も連動します。閲覧中は押しても反応しません。</p>
    <footer><button id="guidePinCancel" type="button">取り消し</button><button id="guidePinConfirm" type="button" class="primary">決定</button></footer>
</dialog>
